apply from: "variables.gradle"
apply from: "ssl-bypass.gradle"
apply from: "capacitor-agp-compat.gradle"

buildscript {
    repositories {
        maven { url 'local-m2' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.5.0'
    }
}

allprojects {
    repositories {
        maven { url uri("${rootDir}/local-m2") }
        google()
        mavenCentral()
    }
    configurations.configureEach {
        resolutionStrategy {
            force 'androidx.core:core:1.13.0'
            force 'androidx.core:core-ktx:1.13.0'
            force 'androidx.core:core-splashscreen:1.0.1'
            force 'androidx.activity:activity:1.8.0'
            force 'androidx.activity:activity-ktx:1.8.0'
            force 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
            force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
            force 'androidx.lifecycle:lifecycle-runtime:2.6.2'
            force 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
            force 'androidx.lifecycle:lifecycle-common:2.6.2'
            force 'androidx.lifecycle:lifecycle-livedata:2.6.2'
            force 'androidx.lifecycle:lifecycle-livedata-core:2.6.2'
            force 'androidx.lifecycle:lifecycle-process:2.6.2'
            force 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2'
            force 'com.google.android.gms:play-services-location:21.3.0'
            force 'com.google.code.gson:gson:2.13.2'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.9.0'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
            eachDependency { details ->
                if (details.requested.group == 'androidx.activity') {
                    details.useVersion '1.8.0'
                }
                if (details.requested.group == 'androidx.lifecycle') {
                    details.useVersion '2.6.2'
                }
                if (details.requested.group == 'com.google.code.gson' && details.requested.name == 'gson') {
                    details.useVersion '2.13.2'
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects {
    afterEvaluate { project ->
        def androidExt = project.extensions.findByName('android')
        if (androidExt != null) {
            androidExt.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            try {
                androidExt.lint {
                    checkReleaseBuilds false
                    abortOnError false
                }
            } catch (ignored) {}
        }
    }
}
