apply from: 'ssl-bypass.gradle'

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'

def localM2 = new File(settingsDir, 'local-m2')
def kotlinPluginVersion = '2.0.21'
def androidPluginVersion = '8.5.0'

gradle.beforeProject { project ->
    project.buildscript.repositories {
        maven { url uri(localM2) }
        google()
        mavenCentral()
    }
    project.repositories {
        maven { url uri(localM2) }
        google()
        mavenCentral()
    }
    project.buildscript.configurations.classpath.resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinPluginVersion"
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin'
                    && details.requested.name.startsWith('kotlin-gradle-plugin')) {
                details.useVersion kotlinPluginVersion
            }
            if (details.requested.group == 'com.android.tools.build'
                    && details.requested.name == 'gradle') {
                details.useVersion androidPluginVersion
            }
        }
    }
}
